<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kiran Interior — Agreement</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--brown:#5d3a20;--gold:#e0c49a;--navy:#1a2b4c;--bg:#f5f2ee;--muted:#666}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#222}
.toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.toolbar strong{color:var(--brown)}
button{border:0;border-radius:6px;padding:10px 15px;cursor:pointer;font-weight:700}.pdf{background:var(--brown);color:#fff}.save{background:var(--navy);color:#fff}.back{background:#eee}
.layout{display:grid;grid-template-columns:390px 1fr;gap:22px;max-width:1400px;margin:22px auto;padding:0 18px}.editor,.paper{background:#fff;border-radius:8px;box-shadow:0 3px 18px rgba(0,0,0,.1)}.editor{padding:20px;position:sticky;top:75px;align-self:start;max-height:calc(100vh - 95px);overflow:auto}.editor h2{margin:0 0 15px;color:var(--brown)}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:5px}.field input,.field textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:5px;font:inherit}.field textarea{min-height:65px;resize:vertical}.pay-grid{display:grid;grid-template-columns:1fr 85px;gap:7px;margin-bottom:7px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.paper{width:210mm;min-height:297mm;margin:0 auto;padding:14mm}.header{height:30mm;background:var(--brown);color:#fff;display:flex;align-items:center;padding:5mm 7mm;gap:8mm}.logo{width:22mm;height:22mm;object-fit:contain;background:#fff;border-radius:3mm;padding:1mm}.brand h1{margin:0;font-size:22px}.brand p{margin:4px 0 0;font-size:12px}.title{display:flex;justify-content:space-between;margin:9mm 0 6mm}.title h2{margin:0;color:var(--brown);font-size:25px;letter-spacing:1px}.meta{text-align:right;font-size:12px;line-height:1.7}.box{border:1px solid #ddd;border-radius:4px;padding:5mm;margin-bottom:6mm}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4mm 10mm}.label{font-size:10px;color:var(--muted);text-transform:uppercase}.value{font-size:13px;font-weight:600;margin-top:1mm;white-space:pre-wrap}.section{margin-top:7mm}.section h3{color:var(--brown);border-bottom:2px solid var(--gold);padding-bottom:2mm;margin-bottom:4mm}.clause{font-size:11px;line-height:1.55;margin:0 0 3mm}.payments{width:100%;border-collapse:collapse;font-size:11px}.payments th{background:var(--gold);color:var(--brown);text-align:left;padding:3mm}.payments td{padding:3mm;border-bottom:1px solid #ddd}.payments td:last-child,.payments th:last-child{text-align:right}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:20mm;margin-top:15mm}.sig{border-top:1px solid #555;padding-top:3mm;font-size:11px}.footer{margin-top:15mm;border-top:1px solid #ddd;padding-top:5mm;font-size:10px;color:#666;display:flex;justify-content:space-between}.small{font-size:10px;color:#666}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.editor{position:relative;top:auto;max-height:none}.paper{width:100%;min-height:auto}}@media print{body{background:#fff}.toolbar,.editor{display:none!important}.layout{display:block;margin:0;padding:0}.paper{box-shadow:none;margin:0;width:210mm;min-height:297mm}}
</style>
</head>
<body>
<div class="toolbar"><strong>Kiran Interior — Agreement Generation</strong><div><button class="back" onclick="window.close()">Close</button> <button class="save" id="saveBtn">Save Agreement</button> <button class="pdf" id="pdfBtn">Generate Agreement PDF</button></div></div>
<div class="layout">
<div class="editor">
<h2>Edit Agreement</h2>
<div class="field"><label>Customer Name</label><input id="customerName"></div>
<div class="field"><label>Customer Phone</label><input id="customerPhone"></div>
<div class="field"><label>Customer Address</label><textarea id="customerAddress"></textarea></div>
<div class="field"><label>Project / Work Description</label><textarea id="projectName">Interior furniture and related works as per approved estimate.</textarea></div>
<div class="field"><label>Agreement Date</label><input type="date" id="agreementDate"></div>
<div class="field"><label>Project Amount (Grand Total)</label><input type="number" id="totalAmount" min="0"></div>
<h3>Payment Schedule</h3>
<div class="pay-grid"><input id="pay1Name" value="First Payment / Advance"><input type="number" id="pay1Pct" value="10" min="0"></div>
<div class="pay-grid"><input id="pay2Name" value="Second Payment"><input type="number" id="pay2Pct" value="50" min="0"></div>
<div class="pay-grid"><input id="pay3Name" value="Balance Payment"><input type="number" id="pay3Pct" value="40" min="0"></div>
<div class="small">Payment percentages should total 100%. Amounts are calculated automatically.</div>
<div class="field" style="margin-top:15px"><label>Agreement Terms — edit as required</label><textarea id="terms" style="min-height:190px"></textarea></div>
<div class="field"><label>Additional Notes</label><textarea id="notes"></textarea></div>
<div class="actions"><button class="save" id="saveBtn2">Save Changes</button><button class="pdf" id="pdfBtn2">Generate PDF</button></div>
</div>
<div class="paper" id="agreementPaper"></div>
</div>
<script>
(function(){
const COMPANY={name:'Kiran Interior',tagline:'Custom Furniture & Interiors',phone:'9966614471',logo:'IMG-20260912-WA0030.jpg'};
const est=JSON.parse(localStorage.getItem('ki_invoice_estimate')||'null');
const defaultTerms=[
'Design Changes — After final approval, any modification in design, size, finish, or material will be chargeable and may increase the timeline.',
'Material Availability — If the selected material is unavailable, a similar alternative will be suggested with client approval.',
'Timeline — Project timeline depends on site readiness, electricity, civil readiness, material supply, approvals, and timely payments.',
'Delay Due to Client Side — If the site is not ready, payments are delayed, or changes are requested, the completion date will automatically extend.',
'Payment Delay — Delayed payments may pause work until dues are cleared.'
];
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function invNo(){return 'KI-AGR-'+String(est?.id||Date.now()).replace(/\D/g,'').slice(-10)}
function load(){
 if(!est){$('agreementPaper').innerHTML='<h2>No saved estimate found.</h2>';return}
 const saved=JSON.parse(localStorage.getItem('ki_agreement_data_'+est.id)||'null');
 $('customerName').value=saved?.customerName??est.custName??'';$('customerPhone').value=saved?.customerPhone??est.custPhone??'';
 $('customerAddress').value=saved?.customerAddress??'';$('projectName').value=saved?.projectName??'Interior furniture and related works as per approved estimate.';
 $('agreementDate').value=saved?.agreementDate??new Date().toISOString().slice(0,10);$('totalAmount').value=saved?.totalAmount??est.grandTotal??0;
 $('pay1Name').value=saved?.payments?.[0]?.name??'First Payment / Advance';$('pay1Pct').value=saved?.payments?.[0]?.pct??10;
 $('pay2Name').value=saved?.payments?.[1]?.name??'Second Payment';$('pay2Pct').value=saved?.payments?.[1]?.pct??50;
 $('pay3Name').value=saved?.payments?.[2]?.name??'Balance Payment';$('pay3Pct').value=saved?.payments?.[2]?.pct??40;
 $('terms').value=saved?.terms??defaultTerms.join('\n');$('notes').value=saved?.notes??'';render();
}
function data(){return {customerName:$('customerName').value.trim(),customerPhone:$('customerPhone').value.trim(),customerAddress:$('customerAddress').value.trim(),projectName:$('projectName').value.trim(),agreementDate:$('agreementDate').value,totalAmount:Number($('totalAmount').value)||0,payments:[{name:$('pay1Name').value.trim(),pct:Number($('pay1Pct').value)||0},{name:$('pay2Name').value.trim(),pct:Number($('pay2Pct').value)||0},{name:$('pay3Name').value.trim(),pct:Number($('pay3Pct').value)||0}],terms:$('terms').value,notes:$('notes').value.trim()}}
function save(){if(!est)return;localStorage.setItem('ki_agreement_data_'+est.id,JSON.stringify(data()));render();alert('Agreement saved.');}
function render(){const d=data();const totalPct=d.payments.reduce((a,p)=>a+p.pct,0);let termHtml=d.terms.split('\n').filter(Boolean).map((t,i)=>`<p class="clause"><strong>${i+1}.</strong> ${esc(t)}</p>`).join('');let payHtml=d.payments.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.pct}%</td><td>${money(d.totalAmount*p.pct/100)}</td></tr>`).join('');$('agreementPaper').innerHTML=`<div class="header"><img class="logo" src="${COMPANY.logo}" onerror="this.style.display='none'"><div class="brand"><h1>${COMPANY.name}</h1><p>${COMPANY.tagline}</p></div></div><div class="title"><h2>WORK AGREEMENT</h2><div class="meta"><strong>Agreement No:</strong> ${invNo()}<br><strong>Date:</strong> ${esc(d.agreementDate||'')}</div></div><div class="box"><div class="grid2"><div><div class="label">Customer</div><div class="value">${esc(d.customerName||'Valued Customer')}</div></div><div><div class="label">Phone</div><div class="value">${esc(d.customerPhone||'N/A')}</div></div><div style="grid-column:1/-1"><div class="label">Address</div><div class="value">${esc(d.customerAddress||'Not provided')}</div></div><div style="grid-column:1/-1"><div class="label">Project / Work</div><div class="value">${esc(d.projectName)}</div></div></div></div><div class="section"><h3>Project Value & Payment Schedule</h3><div class="small">Agreed project amount: <strong>${money(d.totalAmount)}</strong></div><table class="payments"><thead><tr><th>Payment Stage</th><th>Percentage</th><th>Amount</th></tr></thead><tbody>${payHtml}</tbody><tfoot><tr><td><strong>Total</strong></td><td><strong>${totalPct}%</strong></td><td><strong>${money(d.totalAmount)}</strong></td></tr></tfoot></table>${totalPct!==100?'<p style="color:#a00;font-size:11px"><strong>Warning:</strong> Payment percentages currently total '+totalPct+'%. Please edit them to total 100%.</p>':''}</div><div class="section"><h3>Agreement Terms & Conditions</h3>${termHtml||'<p class="small">No terms added.</p>'}</div>${d.notes?`<div class="section"><h3>Additional Notes</h3><p class="clause">${esc(d.notes)}</p></div>`:''}<div class="signatures"><div class="sig">For Kiran Interior<br><br>Authorized Signature</div><div class="sig">Customer: ${esc(d.customerName||'') }<br><br>Customer Signature</div></div><div class="footer"><div>Contact: ${COMPANY.phone}</div><div>Agreement generated from saved estimate</div></div>`}
async function imageData(url){try{const img=new Image();img.src=url;await new Promise((r,j)=>{img.onload=r;img.onerror=j});const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);return c.toDataURL('image/jpeg')}catch(e){return null}}
async function pdf(){const d=data(), totalPct=d.payments.reduce((a,p)=>a+p.pct,0);if(totalPct!==100){if(!confirm('Payment percentages total '+totalPct+'%, not 100%. Generate anyway?'))return}const {jsPDF}=window.jspdf,doc=new jsPDF('p','mm','a4'),brown=[93,58,32],gold=[224,196,150];const logo=await imageData(COMPANY.logo);doc.setFillColor(...brown);doc.rect(0,0,210,30,'F');if(logo)doc.addImage(logo,'JPEG',10,4,22,22);doc.setTextColor(255,255,255);doc.setFont('Helvetica','bold');doc.setFontSize(18);doc.text(COMPANY.name,38,14);doc.setFont('Helvetica','normal');doc.setFontSize(9);doc.text(COMPANY.tagline,38,21);doc.setTextColor(...brown);doc.setFont('Helvetica','bold');doc.setFontSize(19);doc.text('WORK AGREEMENT',14,42);doc.setFont('Helvetica','normal');doc.setFontSize(9);doc.setTextColor(0);doc.text('Agreement No: '+invNo(),196,39,{align:'right'});doc.text('Date: '+(d.agreementDate||''),196,45,{align:'right'});doc.setDrawColor(210);doc.roundedRect(14,51,182,34,2,2,'S');doc.setFont('Helvetica','bold');doc.setFontSize(8);doc.setTextColor(100);doc.text('CUSTOMER',18,58);doc.setFontSize(11);doc.setTextColor(0);doc.text(d.customerName||'Valued Customer',18,65);doc.setFont('Helvetica','normal');doc.setFontSize(9);doc.text('Phone: '+(d.customerPhone||'N/A'),18,71);doc.text('Address: '+(d.customerAddress||'Not provided'),18,77,{maxWidth:170});let y=94;doc.setFont('Helvetica','bold');doc.setFontSize(12);doc.setTextColor(...brown);doc.text('Project & Payment Schedule',14,y);y+=7;doc.setFont('Helvetica','normal');doc.setFontSize(9);doc.setTextColor(0);const desc=doc.splitTextToSize('Project / Work: '+d.projectName,182);doc.text(desc,14,y);y+=desc.length*5+3;doc.text('Agreed Project Amount: Rs.'+d.totalAmount.toLocaleString('en-IN'),14,y);y+=8;doc.setFillColor(...gold);doc.rect(14,y-5,182,9,'F');doc.setFont('Helvetica','bold');doc.setTextColor(...brown);doc.text('Payment Stage',18,y);doc.text('Percentage',110,y);doc.text('Amount',196,y,{align:'right'});y+=8;doc.setFont('Helvetica','normal');doc.setTextColor(0);d.payments.forEach(p=>{doc.text(p.name,18,y,{maxWidth:85});doc.text(p.pct+'%',110,y);doc.text('Rs.'+(d.totalAmount*p.pct/100).toLocaleString('en-IN'),196,y,{align:'right'});y+=7});doc.setFont('Helvetica','bold');doc.line(14,y,196,y);y+=7;doc.text('Total',18,y);doc.text(totalPct+'%',110,y);doc.text('Rs.'+d.totalAmount.toLocaleString('en-IN'),196,y,{align:'right'});y+=12;if(y>245){doc.addPage();y=25}doc.setFontSize(12);doc.setTextColor(...brown);doc.text('Agreement Terms & Conditions',14,y);y+=7;doc.setFont('Helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(0);for(const t of d.terms.split('\n').filter(Boolean)){const lines=doc.splitTextToSize(t,176);if(y+lines.length*4.5>278){doc.addPage();y=25;doc.setFont('Helvetica','bold');doc.setFontSize(10);doc.text('Agreement Terms & Conditions (contd.)',14,y);y+=7;doc.setFont('Helvetica','normal');doc.setFontSize(8.5)}doc.text('• '+lines[0],16,y);if(lines.length>1)doc.text(lines.slice(1),21,y+4.5);y+=lines.length*4.5+3}if(d.notes){if(y>260){doc.addPage();y=25}doc.setFont('Helvetica','bold');doc.setFontSize(11);doc.setTextColor(...brown);doc.text('Additional Notes',14,y);y+=6;doc.setFont('Helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(0);doc.text(doc.splitTextToSize(d.notes,176),16,y)}doc.setFontSize(8);doc.setTextColor(100);doc.text('For Kiran Interior: ____________________',14,284);doc.text('Customer Signature: ____________________',115,284);doc.text('Contact: '+COMPANY.phone,14,290);doc.save('Kiran_Interior_Agreement_'+String(d.customerName||'Customer').replace(/[^a-z0-9]+/gi,'_')+'.pdf')}
['customerName','customerPhone','customerAddress','projectName','agreementDate','totalAmount','pay1Name','pay1Pct','pay2Name','pay2Pct','pay3Name','pay3Pct','terms','notes'].forEach(id=>$(id).addEventListener('input',render));$('saveBtn').onclick=save;$('saveBtn2').onclick=save;$('pdfBtn').onclick=pdf;$('pdfBtn2').onclick=pdf;load();
})();
</script>
</body></html>
